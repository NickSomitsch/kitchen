project_id = "kitchen-inventory"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 2000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://nicksomitsch.github.io/kitchen/"
additional_redirect_urls = ["https://nicksomitsch.github.io/kitchen/", "http://localhost:5173/kitchen/", "http://127.0.0.1:4173/kitchen/"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.scan-image]
# Recognition runs as the signed-in caller so the daily allowance and household
# membership are both enforced by row level security.
verify_jwt = true
